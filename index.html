<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>ระบบบันทึกการซื้อขายลูกค้า</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Sarabun', sans-serif; }
        .app-container { max-width: 800px; margin: 30px auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="app-container">
    <h3 class="text-primary mb-4">📝 บันทึกรายการซื้อขาย</h3>

    <!-- ฟอร์มบันทึกข้อมูล -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <form id="transactionForm" onsubmit="saveTransaction(event)">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">ชื่อลูกค้า / รหัส</label>
                        <input type="text" id="customerName" class="form-control" placeholder="เช่น ยายม้วน หรือ 001" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">รายการสินค้า</label>
                        <input type="text" id="itemName" class="form-control" placeholder="เช่น น้ำแข็ง 10 สอบ" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">ยอดรวม (บาท)</label>
                        <input type="number" id="totalAmount" class="form-control" placeholder="0" required min="0">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-success">รับเงินสด (บาท)</label>
                        <input type="number" id="paidAmount" class="form-control border-success" placeholder="0" required min="0">
                    </div>
                </div>
                <div class="mt-3 text-end">
                    <button type="submit" class="btn btn-primary px-4">💾 บันทึกรายการ</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ตารางแสดงประวัติ -->
    <h5 class="fw-bold mb-3">ประวัติการทำรายการล่าสุด</h5>
    <div class="table-responsive">
        <table class="table table-hover table-bordered align-middle">
            <thead class="table-dark">
                <tr>
                    <th>วัน-เวลา</th>
                    <th>ลูกค้า</th>
                    <th>รายการ</th>
                    <th class="text-end">ยอดรวม</th>
                    <th class="text-end">รับเงินมา</th>
                    <th class="text-end">ค้างชำระ</th>
                    <th class="text-center">จัดการ</th>
                </tr>
            </thead>
            <tbody id="historyTableBody">
                <!-- ข้อมูลจะถูกแสดงที่นี่ -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // ดึงข้อมูลจาก LocalStorage หรือสร้าง Array ว่างถ้ายังไม่มีข้อมูล
    let transactions = JSON.parse(localStorage.getItem('simple_transactions')) || [];

    // ฟังก์ชันบันทึกข้อมูล
    function saveTransaction(e) {
        e.preventDefault();
        
        let customer = document.getElementById('customerName').value.trim();
        let item = document.getElementById('itemName').value.trim();
        let total = parseFloat(document.getElementById('totalAmount').value) || 0;
        let paid = parseFloat(document.getElementById('paidAmount').value) || 0;
        let debt = total - paid;
        
        let now = new Date();
        let dateTime = now.toLocaleDateString('th-TH') + " " + now.toLocaleTimeString('th-TH', {hour: '2-digit', minute:'2-digit'});

        // สร้าง Object เก็บข้อมูล
        let newRecord = {
            id: Date.now(),
            time: dateTime,
            customer: customer,
            item: item,
            total: total,
            paid: paid,
            debt: debt
        };

        // เพิ่มข้อมูลลงหน้าสุดของ Array
        transactions.unshift(newRecord);
        
        // บันทึกลง LocalStorage
        localStorage.setItem('simple_transactions', JSON.stringify(transactions));
        
        // ล้างค่าในฟอร์มและโหลดตารางใหม่
        document.getElementById('transactionForm').reset();
        document.getElementById('customerName').focus();
        renderTable();
    }

    // ฟังก์ชันแสดงผลตาราง
    function renderTable() {
        let tbody = document.getElementById('historyTableBody');
        tbody.innerHTML = "";
        
        if (transactions.length === 0) {
            tbody.innerHTML = "<tr><td colspan='7' class='text-center text-muted'>ยังไม่มีประวัติการซื้อขาย</td></tr>";
            return;
        }

        transactions.forEach(t => {
            let debtClass = t.debt > 0 ? "text-danger fw-bold" : "text-success";
            tbody.innerHTML += `
                <tr>
                    <td class="text-muted small">${t.time}</td>
                    <td class="fw-bold">${t.customer}</td>
                    <td>${t.item}</td>
                    <td class="text-end">${t.total}</td>
                    <td class="text-end text-success">${t.paid}</td>
                    <td class="text-end ${debtClass}">${t.debt}</td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteTransaction(${t.id})">ลบ</button>
                    </td>
                </tr>
            `;
        });
    }

    // ฟังก์ชันลบข้อมูล
    function deleteTransaction(id) {
        if (confirm("ยืนยันการลบรายการนี้?")) {
            transactions = transactions.filter(t => t.id !== id);
            localStorage.setItem('simple_transactions', JSON.stringify(transactions));
            renderTable();
        }
    }

    // โหลดตารางครั้งแรกที่เปิดเว็บ
    renderTable();
</script>

</body>
</html>
